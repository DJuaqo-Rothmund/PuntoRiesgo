# Compila el APK de prueba de PuntoRiesgo con `flet build apk`.
#
# Se ejecuta en cada push a main o a ramas claude/**, o a mano desde
# GitHub → Actions → "Build APK" → "Run workflow".
# El APK queda como artefacto descargable del run ("puntoriesgo-apk").
#
# Firma: sin secretos, el APK sale firmado con la clave de debug (sirve
# para instalar a mano en teléfonos de prueba). Para firmar con clave propia
# define los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD.

name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLET_VERSION: "1.0.3"
  FLUTTER_VERSION: "3.44.8"   # la que exige flet==1.0.3 (flet.version.flutter_version)
  FLET_CLI_NO_RICH_OUTPUT: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Caché de Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter/${{ env.FLUTTER_VERSION }}
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flet-${{ env.FLET_VERSION }}

      - name: Instalar Flet CLI
        run: pip install "flet[all]==${FLET_VERSION}"

      - name: Clave de firma (opcional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "keystore=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: flet build apk
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=(--yes --skip-flutter-doctor --verbose
                --build-number "${{ github.run_number }}"
                --build-version "0.1.${{ github.run_number }}")
          if [ -n "$KEYSTORE" ]; then
            ARGS+=(--android-signing-key-store "$KEYSTORE"
                   --android-signing-key-store-password "$KEYSTORE_PASSWORD"
                   --android-signing-key-alias "$KEY_ALIAS"
                   --android-signing-key-password "$KEY_PASSWORD")
          fi
          flet build apk "${ARGS[@]}"
          ls -la build/apk

      - name: Renombrar APK
        run: |
          cd build/apk
          for f in *.apk; do
            mv "$f" "PuntoRiesgo-0.1.${{ github.run_number }}-${f}"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: puntoriesgo-apk
          path: build/apk/*.apk
          retention-days: 30
          if-no-files-found: error
